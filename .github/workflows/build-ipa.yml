name: Build Lumina iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Lumina.xcodeproj -scheme Lumina \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/lumina-build" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/lumina-build/Build/Products/Release-iphoneos/Lumina.app" "$RUNNER_TEMP/ipa/Payload/Lumina.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Lumina-UNSIGNED.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Lumina-UNSIGNED.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-UNSIGNED-IPA
          path: Lumina-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14
